version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
      time: "11:00"
    commit-message:
      prefix: "[Production]"
      prefix-development: "[Development]"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "11:00"
    commit-message:
      prefix: "[Development]"
    open-pull-requests-limit: 10
